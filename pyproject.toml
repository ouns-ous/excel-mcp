[project]
name = "excel-mcp"
version = "1.0.0"
description = "Microsoft Excel Live COM Desktop Automation & Headless OOXML MCP Server for Windows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp<2",
    "pywin32>=306",
    "pydantic>=2.0.0",
    "openpyxl>=3.1.2",
    "pillow>=10.0.0",
    "tabulate>=0.9.0",
]

[project.scripts]
excel-mcp = "server:main"

[tool.setuptools]
py-modules = ["server", "excel_controller", "excel_engine"]
